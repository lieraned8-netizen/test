const Q=[{"year":"115-2","no":1,"answer":"B","correct":["B"],"question":"土木包工業若違反越區營業規定，按其情節輕重會受下列何者處分？","options":{"A":"予以警告或六個月以上一年以下停業處分","B":"予以警告或三個月以上一年以下停業處分","C":"予以警告或三個月以上二年以下停業處分","D":"予以警告或六個月以上二年以下停業處分"}},{"year":"115-2","no":2,"answer":"送分","correct":[],"question":"依政府採購法第 63 條規定，委託規劃、設計、監造或管理之契約應訂明什麼責任？","options":{"A":"契約的期限和金額","B":"廠商規劃設計錯誤、監造不實或管理不善，致機關遭受損害之責任","C":"機關的職責和權限","D":"廠商的資格和能力"}},{"year":"115-2","no":3,"answer":"B","correct":["B"],"question":"依水污染防治法，有關削減廢水污染削減計畫之敘述，以下何者正確？","options":{"A":"營建工地應於取得建築執照時檢附該計畫經主管機關核准","B":"營建工地應於施工前檢附該計畫經主管機關核准","C":"削減計畫變更時，可於竣工後一次向主管機關申報","D":"削減計畫應記載事項免檢附目的事業主管機關核發之證明文件影本"}},{"year":"115-2","no":4,"answer":"B","correct":["B"],"question":"得標廠商對於工程、勞務契約有什麼義務？","options":{"A":"可以轉包給其他廠商","B":"自行履行，不得轉包","C":"可以自行選擇是否履行","D":"可以將契約交由第三方處理"}},{"year":"115-2","no":5,"answer":"C","correct":["C"],"question":"依營建工地水污染防治措施有關沉砂池總設計容量，應為工地或作業場所範圍總面積乘以下列何者？","options":{"A":"0.04 公尺以上","B":"0.03 公尺以上","C":"0.025 公尺以上","D":"0.02 公尺以上"}},{"year":"115-2","no":6,"answer":"B","correct":["B"],"question":"營建工地辦公室及工寮若違反污水之放流水標準，將會遭受下列何種裁罰？","options":{"A":"新台幣 5 千元以上 50 萬元以下罰鍰","B":"新台幣 3 千元以上 30 萬元以下罰鍰","C":"新台幣 4 千元以上 40 萬元以下罰鍰","D":"新台幣 2 千元以上 20 萬元以下罰鍰"}},{"year":"115-2","no":7,"answer":"D","correct":["D"],"question":"下列何者不是廢棄物清理法之法定執行機關？","options":{"A":"直轄市政府環境保護局","B":"市公所","C":"鄉公所","D":"里辦公室"}},{"year":"115-2","no":8,"answer":"C","correct":["C"],"question":"違反職業安全衛生法第 6 條第 1 項規定，未提供勞工安全衛生設備造成 3 人罹災之職業災害時，對雇主之罰責為何？","options":{"A":"新臺幣三萬元以上三十萬元以下罰金","B":"新臺幣三萬元以上三十萬元以下罰鍰","C":"處一年以下有期徒刑、拘役或科或併科新臺幣十八萬元以下罰金","D":"處三年以下有期徒刑、拘役或科或併科新臺幣三十萬元以下罰金"}},{"year":"115-2","no":9,"answer":"A","correct":["A"],"question":"依據營造安全衛生設施標準之規定，雇主僱用勞工從事露天開挖時，為防止地面之崩塌或土石之飛落，幾級以上地震後，應指定專人確認作業地點之地面有無龜裂等狀況，並採取必要之安全措施？","options":{"A":"4 級","B":"5 級","C":"5.5 級","D":"6 級"}},{"year":"115-2","no":10,"answer":"A","correct":["A"],"question":"下列何者非建築法所稱建築物設備？","options":{"A":"防音","B":"空氣調節","C":"煤氣","D":"電力"}},{"year":"115-2","no":11,"answer":"A"
