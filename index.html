<section id="home" class="card"><h2>開始模擬考</h2><p>題庫共 <b id="total"></b> 題；送分題保留於題庫但不列入計分。隨機抽題時，情境題組會整組保留，因此實際題數可能略多於設定題數。</p><div class="grid">
<div><b>題數</b><select id="count"><option>10</option><option>20</option><option selected>50</option></select></div>
<div><b>梯次</b><select id="year"><option value="all">全部梯次</option></select></div>
<div><b>時間</b><select id="mins"><option value="0">不限時</option><option>30</option><option selected>60</option><option>90</option></select></div>
<div><b>順序</b><select id="order"><option value="random">隨機抽題</option><option value="original">依題庫順序</option></select></div></div>
<p><button class="primary" onclick="start()">開始測驗</button> <button class="secondary" onclick="showBank()">完整題庫</button></p>
</section>
<section id="exam" class="hidden"><div class="card"><div class="toolbar"><b id="progress"></b><span id="timer"></span></div><div id="nav" class="nav"></div></div>
